<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>BVH Mocap -> VRM Clip Converter</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; color: #eee; font: 13px sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel {
    position: fixed;
    top: 0;
    left: 0;
    width: 320px;
    height: 100%;
    box-sizing: border-box;
    padding: 12px;
    background: rgba(0, 0, 0, 0.75);
    overflow-y: auto;
    z-index: 10;
  }
  #panel h2 { font-size: 14px; margin: 0 0 8px; }
  #panel label { display: block; margin-top: 10px; font-size: 12px; opacity: 0.8; }
  #panel input[type="text"], #panel select {
    width: 100%;
    box-sizing: border-box;
    padding: 4px;
    margin-top: 2px;
    background: #222;
    color: #eee;
    border: 1px solid #444;
  }
  #panel button {
    margin-top: 10px;
    width: 100%;
    padding: 6px;
    cursor: pointer;
  }
  #panel button:disabled { opacity: 0.4; cursor: default; }
  #panel hr { border: none; border-top: 1px solid #444; margin: 16px 0 8px; }
  .row { display: flex; gap: 6px; }
  .row button { margin-top: 6px; }
  #delete-existing-btn { flex: 0 0 auto; background: #522; color: #fff; border: 1px solid #833; }
  #log {
    margin-top: 12px;
    white-space: pre-wrap;
    font-size: 11px;
    opacity: 0.85;
    max-height: 200px;
    overflow-y: auto;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
  }
}
</script>
</head>
<body>
<div id="panel">
  <h2>BVH Mocap -&gt; VRM Clip Converter</h2>
  <p style="opacity:0.7; font-size:11px;">
    For CMU-style BVH mocap (the classic ASF/AMC-derived skeleton naming
    -- see cmu_bvh_rig_map.js). Other BVH sources will only work well if
    they reuse the same bone names; check with inspect_skeleton.html
    first if unsure.
  </p>

  <label>VRM model path (relative to this page)</label>
  <input id="model-path" type="text" value="./models/placeholder.vrm" />
  <button id="load-vrm-btn">Load VRM</button>

  <label>BVH file</label>
  <input id="bvh-input" type="file" accept=".bvh" disabled />

  <label>Clip id (used as the filename, e.g. "cmu_walk_01")</label>
  <input id="clip-id" type="text" placeholder="my_new_clip" />

  <label>Description (used for text matching -- see MotionSelector)</label>
  <input id="clip-description" type="text" placeholder="describe when this clip should play" />

  <label>Expression to fire alongside this clip (optional)</label>
  <select id="clip-expression">
    <option value="">(none)</option>
    <option value="happy">happy</option>
    <option value="angry">angry</option>
    <option value="sad">sad</option>
    <option value="relaxed">relaxed</option>
    <option value="surprised">surprised</option>
  </select>

  <button id="replay-btn" disabled>Replay preview</button>
  <button id="export-btn" disabled>Save to library</button>

  <hr />
  <h2>Existing animations</h2>
  <label>Clips already in lib/motion/clips/</label>
  <select id="existing-select"><option value="">(loading...)</option></select>
  <div class="row">
    <button id="preview-existing-btn" style="flex:1;">Preview</button>
    <button id="delete-existing-btn" title="Delete this clip">&#128465;</button>
  </div>

  <div id="log"></div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { BVHLoader } from "three/addons/loaders/BVHLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";
import { cmuBvhRigMap, CMU_BVH_HIPS_NAME } from "./cmu_bvh_rig_map.js";

const params = new URLSearchParams(window.location.search);
const modelPathInput = document.getElementById("model-path");
modelPathInput.value = params.get("model") || modelPathInput.value;

const logEl = document.getElementById("log");
function log(message) {
  console.log(message);
  logEl.textContent = `${message}\n${logEl.textContent}`.slice(0, 4000);
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);
camera.position.set(0, 1.3, 2.6);

const light = new THREE.DirectionalLight(0xffffff, 1.5);
light.position.set(1, 1, 1).normalize();
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.update();

let currentVrm = null;
let mixer = null;
let currentAction = null;
let retargetedClip = null;

const VRM1_EXPRESSIONS = new Set(["happy", "angry", "sad", "relaxed", "surprised", "neutral"]);
const VRM0_EXPRESSION_MAP = { happy: "joy", angry: "angry", sad: "sorrow", relaxed: "fun", surprised: null, neutral: "neutral" };
let currentExpressionName = null;

function setExpression(name, value) {
  if (!currentVrm) return;
  if (currentVrm.expressionManager) {
    if (currentExpressionName && currentExpressionName !== name) {
      currentVrm.expressionManager.setValue(currentExpressionName, 0);
      currentExpressionName = null;
    }
    if (VRM1_EXPRESSIONS.has(name)) {
      currentVrm.expressionManager.setValue(name, value);
      currentExpressionName = value > 0 ? name : null;
    }
  } else if (currentVrm.blendShapeProxy) {
    const vrm0Name = VRM0_EXPRESSION_MAP[name];
    if (currentExpressionName && currentExpressionName !== vrm0Name) {
      currentVrm.blendShapeProxy.setValue(currentExpressionName, 0);
      currentExpressionName = null;
    }
    if (vrm0Name) {
      currentVrm.blendShapeProxy.setValue(vrm0Name, value);
      currentExpressionName = value > 0 ? vrm0Name : null;
    }
  }
}

function clearExpression() {
  if (currentExpressionName) setExpression(currentExpressionName, 0);
}

function applySelectedExpression() {
  const name = document.getElementById("clip-expression").value;
  if (name) setExpression(name, 1.0);
  else clearExpression();
}
document.getElementById("clip-expression").addEventListener("change", applySelectedExpression);

function loadVrm(path) {
  const loader = new GLTFLoader();
  loader.register((parser) => new VRMLoaderPlugin(parser));
  loader.load(
    path,
    (gltf) => {
      const vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      VRMUtils.rotateVRM0(vrm);

      if (currentVrm) {
        scene.remove(currentVrm.scene);
      }
      scene.add(vrm.scene);
      currentVrm = vrm;
      mixer = new THREE.AnimationMixer(vrm.scene);
      currentAction = null;
      retargetedClip = null;
      currentExpressionName = null;
      document.getElementById("bvh-input").disabled = false;
      document.getElementById("replay-btn").disabled = true;
      document.getElementById("export-btn").disabled = true;
      log(`Loaded VRM from ${path}`);
    },
    undefined,
    (error) => log(`Failed to load VRM: ${error}`)
  );
}

document.getElementById("load-vrm-btn").addEventListener("click", () => {
  loadVrm(modelPathInput.value);
});
loadVrm(modelPathInput.value);

// Same retargeting technique as convert_mixamo.html (verified against
// three-vrm's own official example there), reading from a BVH skeleton
// instead of an FBX scene graph -- BVHLoader returns {skeleton, clip}
// rather than a scene, so bone lookups go through skeleton.bones instead
// of getObjectByName, but the quaternion math is identical.
async function loadBvhFromFile(file, vrm) {
  const objectUrl = URL.createObjectURL(file);
  try {
    const loader = new BVHLoader();
    const result = await loader.loadAsync(objectUrl);
    const root = result.skeleton.bones[0];
    root.updateWorldMatrix(true, true); // BVH bones aren't in a rendered scene, so matrixWorld isn't kept current automatically

    const findBone = (name) => result.skeleton.bones.find((b) => b.name === name);

    const tracks = [];
    const restRotationInverse = new THREE.Quaternion();
    const parentRestWorldRotation = new THREE.Quaternion();
    const _quatA = new THREE.Quaternion();

    const hipsBone = findBone(CMU_BVH_HIPS_NAME);
    if (!hipsBone) {
      throw new Error(`No "${CMU_BVH_HIPS_NAME}" bone found -- this BVH may not use the expected skeleton naming.`);
    }
    const sourceHipsHeight = hipsBone.position.y;
    const vrmHipsHeight = vrm.humanoid.normalizedRestPose.hips.position[1];
    const hipsPositionScale = vrmHipsHeight / sourceHipsHeight;

    let matchedTracks = 0;
    result.clip.tracks.forEach((track) => {
      const trackSplitted = track.name.split(".");
      const sourceBoneName = trackSplitted[0];
      const vrmBoneName = cmuBvhRigMap[sourceBoneName];
      const vrmNodeName = vrm.humanoid?.getNormalizedBoneNode(vrmBoneName)?.name;
      const sourceBone = findBone(sourceBoneName);

      if (vrmNodeName == null || !sourceBone) return;
      matchedTracks++;

      const propertyName = trackSplitted[1];
      sourceBone.getWorldQuaternion(restRotationInverse).invert();
      sourceBone.parent.getWorldQuaternion(parentRestWorldRotation);

      if (track instanceof THREE.QuaternionKeyframeTrack) {
        for (let i = 0; i < track.values.length; i += 4) {
          const flatQuaternion = track.values.slice(i, i + 4);
          _quatA.fromArray(flatQuaternion);
          _quatA.premultiply(parentRestWorldRotation).multiply(restRotationInverse);
          _quatA.toArray(flatQuaternion);
          flatQuaternion.forEach((v, index) => {
            track.values[index + i] = v;
          });
        }
        tracks.push(
          new THREE.QuaternionKeyframeTrack(
            `${vrmNodeName}.${propertyName}`,
            track.times,
            track.values.map((v, i) => (vrm.meta?.metaVersion === "0" && i % 2 === 0 ? -v : v))
          )
        );
      } else if (track instanceof THREE.VectorKeyframeTrack) {
        const value = track.values.map(
          (v, i) => (vrm.meta?.metaVersion === "0" && i % 3 !== 1 ? -v : v) * hipsPositionScale
        );
        tracks.push(new THREE.VectorKeyframeTrack(`${vrmNodeName}.${propertyName}`, track.times, value));
      }
    });

    log(`Retargeted ${matchedTracks} of ${result.clip.tracks.length} tracks (unmatched tracks are usually fingers/socket joints this rig map skips).`);
    return new THREE.AnimationClip("vrmAnimation", result.clip.duration, tracks);
  } finally {
    URL.revokeObjectURL(objectUrl);
  }
}

function playPreview(clip) {
  if (currentAction) currentAction.stop();
  currentAction = mixer.clipAction(clip);
  currentAction.setLoop(THREE.LoopRepeat);
  currentAction.play();
  applySelectedExpression();
}

document.getElementById("bvh-input").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (!file || !currentVrm) return;
  log(`Loading ${file.name}...`);
  try {
    retargetedClip = await loadBvhFromFile(file, currentVrm);
    playPreview(retargetedClip);
    document.getElementById("replay-btn").disabled = false;
    document.getElementById("export-btn").disabled = false;
    if (!document.getElementById("clip-id").value) {
      document.getElementById("clip-id").value = file.name.replace(/\.bvh$/i, "").toLowerCase().replace(/[^a-z0-9]+/g, "_");
    }
    log(`Clip ready, duration ${retargetedClip.duration.toFixed(2)}s. Previewing on loop.`);
  } catch (err) {
    log(`Loading failed: ${err.message}`);
  }
});

document.getElementById("replay-btn").addEventListener("click", () => {
  if (retargetedClip) playPreview(retargetedClip);
});

document.getElementById("export-btn").addEventListener("click", async () => {
  if (!retargetedClip) return;
  const id = document.getElementById("clip-id").value.trim();
  const description = document.getElementById("clip-description").value.trim();
  const expression = document.getElementById("clip-expression").value || null;

  if (!id) {
    log("Clip id is required before saving.");
    return;
  }
  if (!/^[A-Za-z0-9_-]+$/.test(id)) {
    log("Clip id can only contain letters, numbers, underscores, and hyphens.");
    return;
  }
  if (!description) {
    log("Description is required before saving -- it's what the classifier matches action text against.");
    return;
  }

  const data = {
    id,
    description,
    duration: retargetedClip.duration,
    expression,
    native_clip: THREE.AnimationClip.toJSON(retargetedClip),
  };

  try {
    const response = await fetch("/api/clips", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || `server responded ${response.status}`);
    log(`Saved "${id}" to lib/motion/clips/ ${result.overwritten ? "(overwrote existing file)" : "(new file)"}.`);
    refreshExistingClips();
  } catch (err) {
    log(`Save failed: ${err.message} -- make sure this page is served by convert_tool_server.py.`);
  }
});

let existingClips = [];

async function refreshExistingClips() {
  const select = document.getElementById("existing-select");
  try {
    const response = await fetch("/api/clips");
    if (!response.ok) throw new Error(`server responded ${response.status}`);
    existingClips = await response.json();
  } catch (err) {
    log(`Could not load existing clips -- make sure this page is served by convert_tool_server.py (${err.message}).`);
    existingClips = [];
  }

  select.innerHTML = "";
  if (existingClips.length === 0) {
    select.innerHTML = '<option value="">(none yet)</option>';
    return;
  }
  for (const clip of existingClips) {
    const option = document.createElement("option");
    option.value = clip.id;
    option.textContent = `${clip.id} -- ${clip.description.slice(0, 40)}`;
    select.appendChild(option);
  }
}
refreshExistingClips();

document.getElementById("preview-existing-btn").addEventListener("click", () => {
  const id = document.getElementById("existing-select").value;
  const clip = existingClips.find((c) => c.id === id);
  if (!clip) return;
  if (!currentVrm) {
    log("Load a VRM first.");
    return;
  }
  if (!clip.native_clip) {
    log(`"${clip.id}" has no native_clip data -- skipping.`);
    return;
  }
  document.getElementById("clip-expression").value = clip.expression || "";
  playPreview(THREE.AnimationClip.parse(clip.native_clip));
  log(`Previewing existing clip "${clip.id}".`);
});

document.getElementById("delete-existing-btn").addEventListener("click", async () => {
  const id = document.getElementById("existing-select").value;
  if (!id) return;
  if (!confirm(`Delete clip "${id}"? This permanently removes it from lib/motion/clips/.`)) return;
  try {
    const response = await fetch(`/api/clips/${encodeURIComponent(id)}`, { method: "DELETE" });
    const result = await response.json();
    if (result.deleted) {
      log(`Deleted "${id}".`);
      refreshExistingClips();
    } else {
      log(`Could not find "${id}" to delete -- it may have already been removed.`);
    }
  } catch (err) {
    log(`Delete failed: ${err.message}`);
  }
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  if (currentVrm) currentVrm.update(delta);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
