<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Avatar Scene</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
  #camera-toggle {
    position: fixed;
    top: 8px;
    left: 8px;
    z-index: 10;
    font: 12px sans-serif;
    padding: 4px 10px;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 4px;
    cursor: pointer;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
  }
}
</script>
</head>
<body>
<button id="camera-toggle">Enable Camera Control</button>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";

// Config via URL query params, e.g.:
//   index.html?controller=mirage&ws=ws://localhost:9001&model=./models/mirage.vrm
//   index.html?controller=user&ws=ws://localhost:9002&model=./models/user.vrm
// Same scene template, two independent instances -- see the architecture
// discussion this came out of: no shared scene, no props/background, each
// instance is meant to be captured as an OBS Browser Source (not Window
// Capture -- that flattens transparency to opaque).
const params = new URLSearchParams(window.location.search);
const MODEL_PATH = params.get("model") || "./models/placeholder.vrm";
const WS_URL = params.get("ws") || "ws://localhost:9001";
const CONTROLLER = params.get("controller") || "unknown";
document.title = `Avatar Scene (${CONTROLLER})`;

// Transparent renderer: alpha:true + zero-alpha clear color. Both are
// required -- without setClearColor's second argument, the canvas still
// clears to opaque black regardless of the alpha:true option.
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);
camera.position.set(0, 1.3, 2.2);

// No props/background by design -- just enough light to see the model.
const light = new THREE.DirectionalLight(0xffffff, 1.5);
light.position.set(1, 1, 1).normalize();
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Camera stays fixed by default -- this is the framing meant for actual
// capture (OBS Browser Source). The button lets you freely orbit/zoom to
// find a framing you like, then lock it back down once you're happy.
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.update();
controls.enabled = false;

const cameraToggleButton = document.getElementById("camera-toggle");
cameraToggleButton.addEventListener("click", () => {
  controls.enabled = !controls.enabled;
  cameraToggleButton.textContent = controls.enabled ? "Lock Camera" : "Enable Camera Control";
});

let currentVrm = null;
let chestBone = null;
let chestRestRotationX = 0;

// Idle breathing: a subtle chest-bone rotation on a sine wave, independent
// of mouth/expression (those are face blendshapes, this is a body bone) --
// runs continuously regardless of what's being said, so the avatar never
// looks frozen between lines.
const BREATH_PERIOD_SECONDS = 4.2;
const BREATH_AMPLITUDE = 0.025;
let elapsedTime = 0;

// VRM's bind pose is defined as T-pose regardless of the model's design --
// three-vrm never applies anything else on top of it, so without this the
// avatar renders arms-out. Applied once on load, on top of which the chest
// breathing and any future gesture/motion system continues to layer.
// Starting values -- tune per-model if the arms end up resting at an odd
// angle; sign is mirrored left/right since normalized bone axes are
// model-relative, not world-relative.
const REST_POSE = {
  leftUpperArm: { z: 1.2 },
  rightUpperArm: { z: -1.2 },
  leftLowerArm: { z: 0.15 },
  rightLowerArm: { z: -0.15 },
};

function applyRestPose(vrm) {
  for (const [boneName, rot] of Object.entries(REST_POSE)) {
    const bone = vrm.humanoid?.getNormalizedBoneNode(boneName);
    if (!bone) continue;
    if (rot.x) bone.rotation.x += rot.x;
    if (rot.y) bone.rotation.y += rot.y;
    if (rot.z) bone.rotation.z += rot.z;
  }
}

// Bones the motion/gesture system (lib/motion/) is allowed to animate.
// Cached once on load, alongside each bone's rotation right after the
// rest pose is applied -- that's this bone's "neutral", not (0,0,0), so
// a clip's deltas compose with the standing pose instead of fighting it.
// "chest" is included for y/z only; its x axis stays owned by the idle
// breathing sine wave below (see applyMotionFrame).
const ANIMATABLE_BONES = [
  "head",
  "neck",
  "chest",
  "spine",
  "hips",
  "leftUpperArm",
  "rightUpperArm",
  "leftLowerArm",
  "rightLowerArm",
  "leftUpperLeg",
  "rightUpperLeg",
  "leftLowerLeg",
  "rightLowerLeg",
];
const boneNodes = {};
const boneBaseline = {};

function captureBoneBaselines(vrm) {
  for (const name of ANIMATABLE_BONES) {
    const node = vrm.humanoid?.getNormalizedBoneNode(name);
    if (!node) continue;
    boneNodes[name] = node;
    boneBaseline[name] = { x: node.rotation.x, y: node.rotation.y, z: node.rotation.z };
  }
}

// Motion/gesture playback -- two representations, see
// lib/motion/types.py's AnimationClip docstring for why:
//   - non-native: keyframed bone-rotation deltas (hand-authored or the
//     procedural fallback) applied on top of each bone's baseline by
//     poseAtTime()/the loop in advanceMotion() below.
//   - native: a real THREE.AnimationClip (retargeted motion capture,
//     e.g. from convert_mixamo.html) played by motionMixer.
// Only one motion plays at a time -- a new one replaces whatever was
// active, same as expressions.
let activeMotion = null;
let motionMixer = null;
const MOTION_BLEND_OUT_SECONDS = 0.3;
// Blend-in is a touch faster than blend-out -- easing OUT of a gesture back
// to idle can take its time, but the gesture itself should feel prompt.
const MOTION_BLEND_IN_SECONDS = 0.2;

function lerp(a, b, t) {
  return a + (b - a) * t;
}

// Smoothstep -- eases both ends of a transition instead of linear
// interpolation, so reaching a pose (and blending back out of one)
// doesn't look like a robotic constant-velocity slide.
function easeInOut(t) {
  return t * t * (3 - 2 * t);
}

function poseAtTime(keyframes, t) {
  if (t <= keyframes[0].t) return keyframes[0].pose;
  for (let i = 1; i < keyframes.length; i++) {
    if (t <= keyframes[i].t) {
      const a = keyframes[i - 1];
      const b = keyframes[i];
      const alpha = easeInOut((t - a.t) / (b.t - a.t || 1));
      const pose = {};
      for (const bone of Object.keys(b.pose)) {
        const av = a.pose[bone] ?? [0, 0, 0];
        const bv = b.pose[bone] ?? [0, 0, 0];
        pose[bone] = [lerp(av[0], bv[0], alpha), lerp(av[1], bv[1], alpha), lerp(av[2], bv[2], alpha)];
      }
      return pose;
    }
  }
  return keyframes[keyframes.length - 1].pose;
}

function playMotion(message) {
  // Stop whatever was previously active, in either representation, before
  // replacing it.
  if (activeMotion?.native) {
    activeMotion.action.stop();
  }

  if (message.native_clip) {
    const clip = THREE.AnimationClip.parse(message.native_clip);
    const action = motionMixer.clipAction(clip);
    action.reset();
    action.setLoop(THREE.LoopOnce);
    action.clampWhenFinished = true;
    action.play();

    // Which of our tracked bones this specific clip actually drives --
    // used after it ends to know which bones need manually blending back
    // to baseline (see advanceMotion(); three.js's own fadeOut has no
    // "idle" action to crossfade into here, so it can't do this for us).
    const trackBoneNames = new Set(clip.tracks.map((track) => track.name.split(".")[0]));
    const boneNames = ANIMATABLE_BONES.filter(
      (name) => boneNodes[name] && trackBoneNames.has(boneNodes[name].name)
    );

    // Some sources (VRMA in particular) bake facial expression directly
    // into the clip as NumberKeyframeTracks (e.g. "happy.weight"), rather
    // than a single static expression name -- treated generically here as
    // "a scalar property on some named object", faded to 0 on blend-out
    // the same way bone rotations ease back to baseline. Mixamo clips
    // never have these, so this is a no-op list for them.
    const numberTracks = clip.tracks
      .filter((track) => track instanceof THREE.NumberKeyframeTrack)
      .map((track) => {
        const dot = track.name.lastIndexOf(".");
        return { objectName: track.name.slice(0, dot), property: track.name.slice(dot + 1) };
      });

    // Snapshot the live (idle) pose right now, before the mixer gets a
    // chance to write the clip's first frame -- this is the "from" side of
    // the blend-in crossfade in advanceMotion() below.
    const blendInFrom = {};
    for (const name of boneNames) {
      blendInFrom[name] = boneNodes[name].quaternion.clone();
    }
    const numberBlendInFrom = numberTracks.map(({ objectName, property }) => {
      const obj = currentVrm.scene.getObjectByName(objectName);
      return { obj, property, from: obj ? obj[property] : 0 };
    });

    activeMotion = {
      native: true,
      action,
      boneNames,
      numberTracks,
      blendInFrom,
      numberBlendInFrom,
      blendStart: null,
      duration: message.duration,
      startTime: elapsedTime,
      expression: message.expression || null,
    };
  } else {
    // Same idea for keyframe clips: capture each animatable bone's current
    // delta from baseline (usually 0 if fully idle, but could be mid
    // blend-out from whatever motion was just interrupted) as the "from"
    // side of the blend-in below.
    const blendInFrom = {};
    for (const name of ANIMATABLE_BONES) {
      const node = boneNodes[name];
      const base = boneBaseline[name];
      if (!node || !base) continue;
      blendInFrom[name] = [node.rotation.x - base.x, node.rotation.y - base.y, node.rotation.z - base.z];
    }

    activeMotion = {
      native: false,
      keyframes: message.keyframes,
      duration: message.duration,
      startTime: elapsedTime,
      expression: message.expression || null,
      blendInFrom,
    };
  }

  if (activeMotion.expression) {
    setExpression(activeMotion.expression, 1.0);
  }
}

function baselineQuaternion(name) {
  const base = boneBaseline[name];
  return new THREE.Quaternion().setFromEuler(new THREE.Euler(base.x, base.y, base.z));
}

// Drives whichever motion is active, in either representation, easing
// back to the rest-pose baseline over MOTION_BLEND_OUT_SECONDS once a
// clip's duration has elapsed rather than snapping back to idle -- and
// clearing the clip's facial expression (if any) in step with the body,
// instead of it staying stuck on the last expression indefinitely.
function advanceMotion() {
  if (!activeMotion) return;
  const t = elapsedTime - activeMotion.startTime;

  if (activeMotion.native) {
    if (t < MOTION_BLEND_IN_SECONDS && t <= activeMotion.duration) {
      // motionMixer.update() (called before advanceMotion() in the render
      // loop) already wrote this frame's real clip pose into these bones --
      // crossfade from the pre-motion idle pose into that moving target
      // rather than replacing it outright, so the clip's own timing is
      // never delayed, only its first fraction of a second is blended.
      const alpha = easeInOut(Math.min(1, t / MOTION_BLEND_IN_SECONDS));
      for (const name of activeMotion.boneNames) {
        const node = boneNodes[name];
        const naturalPose = node.quaternion.clone();
        node.quaternion.slerpQuaternions(activeMotion.blendInFrom[name], naturalPose, alpha);
      }
      for (const { obj, property, from } of activeMotion.numberBlendInFrom) {
        if (obj) obj[property] = lerp(from, obj[property], alpha);
      }
    }

    if (t <= activeMotion.duration) return; // motionMixer (blended in above) is driving the bones this frame

    if (!activeMotion.blendStart) {
      // Clip just finished -- stop the mixer from fighting our manual
      // writes, and capture each affected bone's current quaternion (and
      // any scalar/expression tracks' current value) as this blend-out's
      // starting point.
      activeMotion.action.stop();
      activeMotion.blendStart = {};
      for (const name of activeMotion.boneNames) {
        activeMotion.blendStart[name] = boneNodes[name].quaternion.clone();
      }
      activeMotion.numberBlendStart = activeMotion.numberTracks.map(({ objectName, property }) => {
        const obj = currentVrm.scene.getObjectByName(objectName);
        return { obj, property, from: obj ? obj[property] : 0 };
      });
    }

    const alpha = easeInOut(Math.min(1, (t - activeMotion.duration) / MOTION_BLEND_OUT_SECONDS));
    for (const name of activeMotion.boneNames) {
      boneNodes[name].quaternion.slerpQuaternions(
        activeMotion.blendStart[name],
        baselineQuaternion(name),
        alpha
      );
    }
    for (const { obj, property, from } of activeMotion.numberBlendStart) {
      if (obj) obj[property] = lerp(from, 0, alpha);
    }

    if (t > activeMotion.duration + MOTION_BLEND_OUT_SECONDS) {
      if (activeMotion.expression) setExpression(activeMotion.expression, 0);
      activeMotion = null;
    }
    return;
  }

  if (t > activeMotion.duration + MOTION_BLEND_OUT_SECONDS) {
    if (activeMotion.expression) setExpression(activeMotion.expression, 0);
    activeMotion = null;
    return;
  }

  for (const name of ANIMATABLE_BONES) {
    const node = boneNodes[name];
    const base = boneBaseline[name];
    if (!node || !base) continue;

    let delta = [0, 0, 0];
    if (t <= activeMotion.duration) {
      const natural = poseAtTime(activeMotion.keyframes, t)[name] ?? [0, 0, 0];
      if (t < MOTION_BLEND_IN_SECONDS) {
        // Crossfade from the pre-motion pose into the clip's own keyframed
        // delta, same idea as the native branch above -- avoids snapping
        // straight to whatever pose the first keyframe happens to specify.
        const alpha = easeInOut(Math.min(1, t / MOTION_BLEND_IN_SECONDS));
        const from = activeMotion.blendInFrom[name] ?? [0, 0, 0];
        delta = [lerp(from[0], natural[0], alpha), lerp(from[1], natural[1], alpha), lerp(from[2], natural[2], alpha)];
      } else {
        delta = natural;
      }
    } else {
      const lastPose = activeMotion.keyframes[activeMotion.keyframes.length - 1].pose[name] ?? [0, 0, 0];
      const alpha = easeInOut((t - activeMotion.duration) / MOTION_BLEND_OUT_SECONDS);
      delta = [lerp(lastPose[0], 0, alpha), lerp(lastPose[1], 0, alpha), lerp(lastPose[2], 0, alpha)];
    }

    if (name === "chest") {
      // x is owned by the idle-breathing sine wave -- only layer y/z here.
      node.rotation.y = base.y + delta[1];
      node.rotation.z = base.z + delta[2];
    } else {
      node.rotation.x = base.x + delta[0];
      node.rotation.y = base.y + delta[1];
      node.rotation.z = base.z + delta[2];
    }
  }
}

const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));
loader.load(
  MODEL_PATH,
  (gltf) => {
    const vrm = gltf.userData.vrm;
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    VRMUtils.removeUnnecessaryJoints(gltf.scene);
    // VRM 0.x models face -Z while three-vrm/glTF conventions expect +Z,
    // so they render facing away from the camera unless corrected. This
    // detects the VRM version and only rotates if it's actually 0.x, so
    // it's safe to leave in even after switching to a VRM 1.0 model.
    VRMUtils.rotateVRM0(vrm);
    scene.add(vrm.scene);
    currentVrm = vrm;

    applyRestPose(vrm);
    captureBoneBaselines(vrm);
    motionMixer = new THREE.AnimationMixer(vrm.scene);

    chestBone = vrm.humanoid?.getNormalizedBoneNode("chest") ?? null;
    if (chestBone) {
      chestRestRotationX = chestBone.rotation.x;
    }

    console.log("Loaded VRM:", vrm);
    // Diagnostic: lists which expression presets this specific model
    // actually has authored. If a name you're trying to trigger (e.g.
    // "happy") isn't in this list, the model itself doesn't support it --
    // that's a model-authoring gap, not a code bug.
    try {
      if (vrm.expressionManager) {
        console.log(
          "Available VRM 1.0 expressions on this model:",
          vrm.expressionManager.expressions.map((e) => e.expressionName)
        );
      } else if (vrm.blendShapeProxy) {
        const groups = vrm.blendShapeProxy.expressionMap ?? vrm.blendShapeProxy._blendShapeGroups;
        console.log(
          "Available VRM 0.x blend shape groups on this model:",
          groups ? Object.keys(groups) : "(could not enumerate -- use debugSetExpression to test directly)"
        );
      } else {
        console.log("This model has no expressionManager or blendShapeProxy at all -- no facial expressions are possible.");
      }
    } catch (err) {
      console.warn("Could not enumerate expressions:", err);
    }
  },
  undefined,
  (error) => console.error("Failed to load VRM model:", error)
);

// Mouth control, compatible with both VRM spec versions -- they expose
// different APIs for the same thing.
function setMouthOpen(value) {
  if (!currentVrm) return;
  if (currentVrm.expressionManager) {
    // VRM 1.0
    currentVrm.expressionManager.setValue("aa", value);
  } else if (currentVrm.blendShapeProxy) {
    // VRM 0.x
    currentVrm.blendShapeProxy.setValue("a", value);
  }
}

// Expression control (happy/angry/sad/relaxed/surprised -- VRM 1.0's
// standard emotion presets). VRM 0.x names these differently and has no
// "surprised" preset at all, hence the mapping/null-skip below. Only one
// expression is ever active at a time -- setting a new one clears
// whichever was active before, rather than letting them blend.
const VRM1_EXPRESSIONS = new Set(["happy", "angry", "sad", "relaxed", "surprised", "neutral"]);
const VRM0_EXPRESSION_MAP = { happy: "joy", angry: "angry", sad: "sorrow", relaxed: "fun", surprised: null, neutral: "neutral" };
let currentExpressionName = null;

function setExpression(name, value) {
  if (!currentVrm) return;
  if (currentVrm.expressionManager) {
    if (currentExpressionName && currentExpressionName !== name) {
      currentVrm.expressionManager.setValue(currentExpressionName, 0);
      currentExpressionName = null;
    }
    if (VRM1_EXPRESSIONS.has(name)) {
      currentVrm.expressionManager.setValue(name, value);
      currentExpressionName = value > 0 ? name : null;
    }
  } else if (currentVrm.blendShapeProxy) {
    const vrm0Name = VRM0_EXPRESSION_MAP[name];
    if (currentExpressionName && currentExpressionName !== vrm0Name) {
      currentVrm.blendShapeProxy.setValue(currentExpressionName, 0);
      currentExpressionName = null;
    }
    if (vrm0Name) {
      currentVrm.blendShapeProxy.setValue(vrm0Name, value);
      currentExpressionName = value > 0 ? vrm0Name : null;
    }
  }
}

// Connects to the local avatar server (lib/avatar.py's LocalSceneProvider)
// and applies whatever it broadcasts -- mouth-open values for lipsync, or
// expression changes timed to *action* text in a reply. Reconnects on
// drop, since the Python process may start after this page does.
function connect() {
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => console.log(`Connected to ${WS_URL} as controller="${CONTROLLER}"`);
  ws.onmessage = (event) => {
    const message = JSON.parse(event.data);
    if (message.type === "mouth") {
      setMouthOpen(message.value);
    } else if (message.type === "expression") {
      setExpression(message.name, message.value);
    } else if (message.type === "motion") {
      playMotion(message);
    }
  };
  ws.onclose = () => {
    console.warn("Avatar server connection closed, retrying in 2s...");
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
}
connect();

// Debug hooks: open this page's browser console and run e.g.
//   debugSetExpression("happy", 1.0)
// to test a specific expression directly, independent of whether the
// Python backend/WebSocket is reaching this page at all. If the face
// doesn't change, check the "Available ... expressions" log above --
// the model likely doesn't have that preset authored.
window.debugSetExpression = setExpression;
window.debugSetMouth = setMouthOpen;
window.debugPlayMotion = playMotion;
window.debugVrm = () => currentVrm;

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  elapsedTime += delta;
  if (currentVrm) {
    if (chestBone) {
      const breath = Math.sin((elapsedTime / BREATH_PERIOD_SECONDS) * Math.PI * 2) * BREATH_AMPLITUDE;
      chestBone.rotation.x = chestRestRotationX + breath;
    }
    if (motionMixer) motionMixer.update(delta);
    advanceMotion();
    currentVrm.update(delta);
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
